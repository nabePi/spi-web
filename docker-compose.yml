# Deploy via Dokploy (Compose). PostgreSQL is managed separately in Dokploy,
# so this file only defines the app. Set the variables below in the Dokploy
# "Environment" tab. Pending DB migrations run automatically on container start.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      DATABASE_URI: ${DATABASE_URI}
    volumes:
      - payload_media:/app/media
      - payload_papers:/app/papers
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  payload_media:
  payload_papers:
